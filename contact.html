
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | CheatVault</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #101018;
      color: #f5f5fa;
      font-family: Arial, sans-serif;
    }

    .contact {
      width: 100%;
      max-width: 480px;
      padding: 36px;
      background: #1b1b28;
      border: 1px solid #343447;
      border-radius: 18px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 30px;
    }

    p {
      color: #aaaabc;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      background: #12121c;
      border: 1px solid #414154;
      border-radius: 8px;
      color: white;
      font: inherit;
    }

    input:focus, textarea:focus {
      outline: 2px solid #a78bfa;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #a78bfa;
      color: #101018;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #c4b5fd;
    }

    footer {
      margin-top: 25px;
      color: #85859a;
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="contact">
    <h1>Contact CheatVault</h1>

    <p>
      Have a question, found an incorrect cheat,
      or want to share feedback?
      We'd love to hear from you.
    </p>

    <form id="contactForm">
      <label for="name">Your Name</label>
      <input id="name" type="text" required
             placeholder="Enter your name">

      <label for="email">Email Address</label>
      <input id="email" type="email" required
             placeholder="you@example.com">

      <label for="message">Your Message</label>
      <textarea id="message" required
                placeholder="How can we help?"></textarea>

      <button type="submit">Send Message</button>
    </form>

    <footer>
      © 2026 CheatVault. All rights reserved.
    </footer>
  </main>

  <script>
    document.getElementById("contactForm")
      .addEventListener("submit", function (event) {
        event.preventDefault();

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const message = document.getElementById("message").value;

        const subject = encodeURIComponent(
          "CheatVault - Support Request"
        );

        const body = encodeURIComponent(
          "Name: " + name + "\n" +
          "Email: " + email + "\n\n" +
          "Message:\n" + message
        );

        window.location.href =
          "mailto:teamcolicarthage@outlook.fr" +
          "?subject=" + subject +
          "&body=" + body;
      });
  </script>
</body>
</html>
